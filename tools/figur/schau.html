<!doctype html><meta charset="utf-8"><script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<body style="margin:0;background:#fff"><canvas id="c" width="1600" height="800"></canvas><script type="module">
import * as THREE from 'three'; import { FBXLoader } from 'three/addons/loaders/FBXLoader.js'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
window.THREE = THREE; window.GLTFExporter = GLTFExporter; window.SkeletonUtils = SkeletonUtils;
window.ladeFbx = url => new Promise((ok, f) => new FBXLoader().load(url, ok, undefined, f));
window.ladeGlb = url => new Promise((ok, f) => new GLTFLoader().load(url, ok, undefined, f));
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); r.setClearColor('#dfe6ee'); window.r = r;
const s = new THREE.Scene(); s.add(new THREE.HemisphereLight('#ffffff', '#778', 2.2)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(2, 4, 3); s.add(d); window.s = s;
// Malt mehrere Ansichten nebeneinander: liste = [{ vor: () => {...}, von: [x,y,z], nach: [x,y,z] }]
window.reihe = (liste, hoch = 2.2) => { const n = liste.length, B = 1600 / n; r.setScissorTest(true); liste.forEach((a, i) => { a.vor && a.vor(); const k = new THREE.OrthographicCamera(-hoch * B / 800 / 2, hoch * B / 800 / 2, hoch / 2, -hoch / 2, 0.1, 100); k.position.set(...a.von); k.lookAt(...a.nach); r.setViewport(i * B, 0, B, 800); r.setScissor(i * B, 0, B, 800); r.render(s, k); }); };
await import(location.search.includes("nach") ? "./nach.js" : "./bake.js"); window.fertig = true;
</script>
