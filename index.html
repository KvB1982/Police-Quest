<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Blaulicht über Möwenbrück</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- three.js kommt aus dem Internet (jsDelivr), wie bei Powershot und Rennspiel. Kein Build-Schritt. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="bild"></canvas>

  <!-- Anzeige oben -->
  <div id="oben">
    <div id="links"><div id="ortName"></div><div id="ziel"></div></div>
    <div id="rechts">
      <span id="uhr"></span><span id="punkte"></span>
      <button id="kFunk" title="Funk (Taste F)">📻</button>
      <button id="kNotiz" title="Notizbuch (Taste N)">📓</button>
      <button id="kTasche" title="Tasche (Taste T)">🎒</button>
    </div>
  </div>
  <div id="pfeil" hidden><div id="pfeilBild">⬆</div><div id="pfeilWeit"></div></div>
  <div id="tacho" hidden></div>
  <div id="toast" hidden></div>

  <!-- Knöpfe für das, was man gerade tun kann -->
  <div id="knoepfe"></div>
  <button id="blaulicht" hidden title="Blaulicht (Taste B)">🚨 Blaulicht</button>
  <div id="fahren" hidden>
    <div><button data-t="links">◀</button><button data-t="rechts">▶</button></div>
    <div><button data-t="runter">Bremse</button><button data-t="hoch">Gas</button></div>
  </div>

  <!-- Sprechblase und Auswahl -->
  <div id="dialog" hidden>
    <div id="wer"></div>
    <div id="text"></div>
    <div id="optionen"></div>
    <button id="weiter">Weiter ▸</button>
  </div>

  <!-- Fenster für Notizbuch, Tasche und Funk -->
  <div id="fenster" class="kasten" hidden>
    <h2 id="fensterTitel"></h2>
    <div id="fensterInhalt"></div>
    <button id="fensterZu">Schließen</button>
  </div>

  <div id="schloss" class="kasten" hidden>
    <h2 id="schlossTitel"></h2>
    <div id="schlossZahl"></div>
    <div id="schlossTasten"></div>
  </div>

  <div id="menue" class="voll" hidden>
    <h1>Blaulicht über Möwenbrück</h1>
    <p>Ein Polizei-Abenteuer · Fall 1: Die Feder im Museum · Tag 1</p>
    <button id="neuesSpiel">Neues Spiel</button>
    <button id="weiterSpielen" hidden>Weiterspielen</button>
    <p class="klein">Laufen: Pfeiltasten oder auf den Boden tippen · Benutzen: E oder Knopf unten · Funk: F · Notizbuch: N · Tasche: T · Blaulicht: B</p>
  </div>

  <div id="ende" class="voll" hidden>
    <h1 id="endeTitel"></h1>
    <p id="endePunkte"></p>
    <p id="endeText"></p>
    <h3>Dein Notizbuch</h3>
    <ul id="endeNotizen"></ul>
    <p class="klein">Tag 2 „Spuren“ folgt in der nächsten Version.</p>
    <button id="endeZu">Weiter herumlaufen</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
