<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Symbol von "Blaulicht über Möwenbrück": ein Blaulicht mit Strahlen über den Wellen des Hafens. Selbst gezeichnet. -->
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12307a"/><stop offset="1" stop-color="#0b1430"/></linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7fb4ff" stop-opacity="0.95"/><stop offset="0.45" stop-color="#3c7dff" stop-opacity="0.45"/><stop offset="1" stop-color="#1e66ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc6ff"/><stop offset="0.5" stop-color="#2f78ff"/><stop offset="1" stop-color="#0f3fb0"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#himmel)"/>
  <circle cx="256" cy="226" r="236" fill="url(#schein)"/>
  <g stroke="#bcd8ff" stroke-width="16" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="48" x2="256" y2="92"/>
    <line x1="118" y1="98" x2="150" y2="130"/><line x1="394" y1="98" x2="362" y2="130"/>
    <line x1="62" y1="226" x2="108" y2="226"/><line x1="450" y1="226" x2="404" y2="226"/>
  </g>
  <!-- die Haube des Blaulichts -->
  <path d="M166 318 V232 a90 90 0 0 1 180 0 V318 Z" fill="url(#glas)" stroke="#dcebff" stroke-width="8"/>
  <path d="M200 236 a56 56 0 0 1 40 -54" fill="none" stroke="#e8f2ff" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <!-- der Sockel -->
  <rect x="136" y="312" width="240" height="42" rx="12" fill="#e9edf5"/>
  <rect x="136" y="338" width="240" height="16" rx="8" fill="#b9c2d4"/>
  <!-- Wellen: der Hafen von Möwenbrück -->
  <path d="M0 404 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 V512 H0 Z" fill="#1c4fb8"/>
  <path d="M0 440 q32 -22 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 V512 H0 Z" fill="#2b6be0"/>
  <path d="M0 476 q32 -20 64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 t64 0 V512 H0 Z" fill="#ffd23a"/>
</svg>
